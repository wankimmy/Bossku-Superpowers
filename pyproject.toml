[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bossku"
version = "2.1.0"
description = "Skills and tools that make AI coding agents do better work, for Cursor, Claude Code, Codex, OpenCode, and OMP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BosskuAI" }]
dependencies = []

[project.scripts]
bossku = "bossku.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bossku*"]
