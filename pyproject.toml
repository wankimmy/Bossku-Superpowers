[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bossku"
version = "2.2.0"
description = "Make your AI coding agent pick the right skill, run its own code, and remember your project rules. For Claude Code, Cursor, Codex, OpenCode and OMP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BosskuAI" }]
dependencies = []

[project.scripts]
bossku = "bossku.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bossku*"]
