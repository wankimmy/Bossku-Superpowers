<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="overview-title overview-description">
  <title id="overview-title">BosskuAI: from your prompt to checked work and verified memory</title>
  <desc id="overview-description">A four-step flow. Describe your task. Select one main skill and useful complements while checking overlap and tool support. Build and check the result. Save verified facts and decisions in configured project memory.</desc>
  <style>
    .canvas { fill: #f4f9f6; }
    .panel { fill: #ffffff; stroke: #cadfd4; stroke-width: 1.5; }
    .focus { fill: #e2f3e9; stroke: #9fcbb3; stroke-width: 1.5; }
    .ink { fill: #17372f; }
    .muted { fill: #49675b; }
    .accent { fill: #086b4f; }
    .edge { fill: none; stroke: #63897b; stroke-width: 2; }
    .arrow { fill: #63897b; }
    text { font-family: "Segoe UI", Arial, sans-serif; }
    .heading { font-size: 28px; font-weight: 650; }
    .body { font-size: 18px; }
    .label { font-size: 15px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #101f1a; }
      .panel { fill: #192d24; stroke: #365548; }
      .focus { fill: #203f30; stroke: #537c65; }
      .ink { fill: #edf7f1; }
      .muted { fill: #b4ccbd; }
      .accent { fill: #70dbad; }
      .edge { stroke: #81aa93; }
      .arrow { fill: #81aa93; }
    }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path class="arrow" d="M 0 0 L 7 4 L 0 8 Z"/>
    </marker>
  </defs>

  <rect class="canvas" width="960" height="520" rx="20"/>
  <text class="ink" x="48" y="53" font-size="32" font-weight="700">BosskuAI</text>
  <text class="muted body" x="48" y="82">Skills, checks, and memory for your task.</text>

  <path class="edge" d="M 300 196 H 366" marker-end="url(#arrowhead)"/>
  <path class="edge" d="M 688 286 V 338" marker-end="url(#arrowhead)"/>
  <path class="edge" d="M 472 412 H 410" marker-end="url(#arrowhead)"/>

  <rect class="panel" x="48" y="126" width="252" height="140" rx="12"/>
  <text class="accent label" x="72" y="157">1 / YOUR TASK</text>
  <text class="ink heading" x="72" y="194">Prompt</text>
  <text class="muted body" x="72" y="228">Ask in plain words.</text>

  <rect class="focus" x="376" y="106" width="536" height="180" rx="12"/>
  <text class="accent label" x="404" y="138">2 / MATCH THE NEEDS</text>
  <text class="ink heading" x="404" y="176">Selected skills</text>
  <text class="accent" x="404" y="213" font-size="21" font-weight="600">One main skill + extra skills as needed</text>
  <text class="muted body" x="404" y="247">Check overlap, availability, and tool support.</text>

  <rect class="panel" x="472" y="348" width="440" height="140" rx="12"/>
  <text class="accent label" x="500" y="379">3 / DO THE WORK</text>
  <text class="ink heading" x="500" y="416">Build + check</text>
  <text class="muted body" x="500" y="448">Make the change, run the checks,</text>
  <text class="muted body" x="500" y="472">and review the evidence.</text>

  <rect class="panel" x="48" y="348" width="350" height="140" rx="12"/>
  <text class="accent label" x="72" y="379">4 / KEEP WHAT IS USEFUL</text>
  <text class="ink heading" x="72" y="416">Verified memory</text>
  <text class="muted body" x="72" y="448">Save verified facts and decisions.</text>
  <text class="muted body" x="72" y="472">Use configured project notes.</text>
</svg>
