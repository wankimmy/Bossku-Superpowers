<title id="t">What a task costs in tokens</title>
<desc id="d">What a task costs in tokens. Input plus output tokens the model processed, all turns (lower is better) Tokens per run (thousands) DeepSeek V4.1 Flash: Without BosskuAI 106k, BosskuAI before 156k, BosskuAI after 171k. Tokens per run (thousands) Nemotron 3 Nano 30B: Without BosskuAI 57k, BosskuAI before 61k, BosskuAI after 221k. Tokens per solved task (thousands) DeepSeek V4.1 Flash: Without BosskuAI 116k, BosskuAI before 161k, BosskuAI after 182k. Tokens per solved task (thousands) Nemotron 3 Nano 30B: Without BosskuAI 257k, BosskuAI before 297k, BosskuAI after 577k.</desc>
